[project]
name = "steamkit"
version = "0.2.2"
description = "Mount drives, bulk-add non-Steam games, and manage them on SteamOS/Linux"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
steamkit = "steamkit.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
